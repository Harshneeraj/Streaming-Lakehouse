# ─── Spark on Kubernetes-free local cluster: tuned for streaming + Hudi ───
spark.master                                  spark://spark-master:7077

# Memory & cores
spark.driver.memory                           1g
spark.executor.memory                         2g
spark.executor.cores                          2

# Adaptive execution helps Hudi's wide writes
spark.sql.adaptive.enabled                    true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.adaptive.skewJoin.enabled           true

# Kryo for Hudi
spark.serializer                              org.apache.spark.serializer.KryoSerializer
spark.kryo.registrator                        org.apache.spark.HoodieSparkKryoRegistrar
spark.kryoserializer.buffer.max               512m

# Hudi-recommended SQL extensions + catalog
spark.sql.extensions                          org.apache.spark.sql.hudi.HoodieSparkSessionExtension
spark.sql.catalog.spark_catalog               org.apache.spark.sql.hudi.catalog.HoodieCatalog

# S3A (MinIO)
spark.hadoop.fs.s3a.endpoint                  http://minio:9000
spark.hadoop.fs.s3a.access.key                admin
spark.hadoop.fs.s3a.secret.key                admin12345
spark.hadoop.fs.s3a.path.style.access         true
spark.hadoop.fs.s3a.connection.ssl.enabled    false
spark.hadoop.fs.s3a.impl                      org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider  org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.committer.name            directory
spark.hadoop.fs.s3a.committer.staging.conflict-mode replace
spark.hadoop.fs.s3a.fast.upload               true
spark.hadoop.fs.s3a.block.size                128M
spark.hadoop.fs.s3a.connection.maximum        100

# Hive Metastore
spark.sql.warehouse.dir                       s3a://warehouse/
spark.hadoop.hive.metastore.uris              thrift://hive-metastore:9083

# Streaming + checkpoint
spark.sql.streaming.metricsEnabled            true
spark.sql.streaming.minBatchesToRetain        20
spark.sql.shuffle.partitions                  16

# Event log (off by default; enable if you want History Server)
spark.eventLog.enabled                        false

# Ivy cache reused across jobs (mounted volume)
spark.jars.ivy                                /home/spark/.ivy2
